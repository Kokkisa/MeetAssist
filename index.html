<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 connect-src https://api.openai.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetAssist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <div id="header">
    <div id="app-name">
      <span class="dot"></span>
      MeetAssist
    </div>
    <div id="record-controls">
      <div id="rec-indicator" class="hidden">
        <span class="rec-dot"></span>
        <span id="rec-timer">00:00</span>
      </div>
      <button id="btn-start-stop" class="start-btn">▶ Start</button>
    </div>
    <div id="win-controls">
      <button class="ctrl-btn" id="btn-settings"  title="Settings">⚙</button>
      <button class="ctrl-btn" id="btn-minimise" title="Minimise">─</button>
      <button class="ctrl-btn" id="btn-hide"     title="Hide (Ctrl+Shift+M to show)">◱</button>
      <button class="ctrl-btn danger" id="btn-close" title="Close">✕</button>
    </div>
  </div>

  <!-- ── SETTINGS BAR — collapsible, hidden by default ───── -->
  <div id="settings-bar" class="hidden">
    <div class="settings-row">
      <label for="input-api-key">OpenAI API Key</label>
      <input type="password" id="input-api-key" placeholder="sk-..." autocomplete="off" />
      <button id="btn-save-settings">Save</button>
    </div>

    <!-- Block 4 — Model selector row -->
    <div class="settings-row">
      <label for="select-model">AI Model</label>
      <select id="select-model">
        <option value="gpt-4o-mini">gpt-4o-mini (fast)</option>
        <option value="gpt-4o">gpt-4o (best)</option>
      </select>
    </div>

    <!-- Block 4 — Whisper language row -->
    <div class="settings-row">
      <label for="input-language">Whisper Language</label>
      <input
        type="text"
        id="input-language"
        placeholder="en"
        maxlength="5"
        style="max-width: 60px;"
        autocomplete="off"
      />
      <span class="settings-hint">e.g. en, hi, te, fr</span>
    </div>

    <!-- Block 4 — Chunk size row -->
    <div class="settings-row">
      <label for="select-chunk">Chunk Size</label>
      <select id="select-chunk">
        <option value="3000">3 seconds</option>
        <option value="5000" selected>5 seconds (default)</option>
        <option value="10000">10 seconds</option>
      </select>
    </div>
  </div>

  <!-- ── TRANSCRIPT PANEL ───────────────────────────────── -->
  <div id="transcript-panel">
    <div id="transcript-header">
      <span class="panel-label">📝 Live Transcript</span>
      <div id="transcript-controls">
        <button class="small-btn" id="btn-clear-transcript" title="Clear transcript">Clear</button>
        <button class="small-btn" id="btn-save-transcript"  title="Save transcript">Save</button>
      </div>
    </div>
    <div id="transcript-body">
      <p class="placeholder-text">Transcript will appear here once recording starts...</p>
    </div>
  </div>

  <!-- ── CONTEXT BAR ────────────────────────────────────── -->
  <div id="context-bar">
    <!-- Block 3 — archived 2026-05-19: replaced the lone panel-label with
         a header row containing the panel-label + a Clear button.
         Original line kept here for reference per archive rule:
           <div class="panel-label">💬 Context &amp; Question</div>
    -->
    <div class="context-bar-header">
      <div class="panel-label">💬 Context &amp; Question</div>
      <button class="small-btn" id="btn-clear-context">Clear</button>
    </div>
    <div id="selected-text-display" class="empty-state">
      Select text from transcript → it appears here
    </div>
    <div id="question-row">
      <input
        type="text"
        id="question-input"
        placeholder="Type your question about the selected context..."
        autocomplete="off"
      />
      <button id="btn-ask">Ask</button>
    </div>
  </div>

  <!-- ── ANSWER PANEL ───────────────────────────────────── -->
  <div id="answer-panel">
    <!-- Block 3 — archived 2026-05-19: replaced the lone panel-label with
         a header row containing the panel-label + a Copy button.
         Original line kept here for reference per archive rule:
           <div class="panel-label">🤖 Answer</div>
    -->
    <!-- Block 6 — archived 2026-05-20: single Copy button, no Clear.
         Replaced by an answer-header-controls wrapper that holds the new
         Clear button alongside Copy. Kept here for reference per archive rule:
           <div class="answer-header">
             <div class="panel-label">🤖 Answer</div>
             <button class="small-btn" id="btn-copy-answer" title="Copy answer">Copy</button>
           </div>
    -->
    <div class="answer-header">
      <div class="panel-label">🤖 Answer</div>
      <div class="answer-header-controls">
        <button class="small-btn" id="btn-clear-answers" title="Clear all answers">Clear</button>
        <button class="small-btn" id="btn-copy-answer"  title="Copy last answer">Copy</button>
      </div>
    </div>
    <div id="answer-body">
      <p class="placeholder-text">Your answer will appear here...</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
